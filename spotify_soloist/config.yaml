name: Spotify Soloist
version: "0.1.1"
slug: spotify_soloist
description: Spotify Connect speaker on Home Assistant, powered by Spotify's official Soloist client
url: https://github.com/supermar1010/ha_spotify_soloist
# Prebuilt images from the "Publish add-on" workflow. Every version in this
# file must be published (GitHub release v<version>) before users update.
image: ghcr.io/supermar1010/{arch}-addon-spotify_soloist
arch:
  - aarch64
  - amd64
init: false
startup: services
# Spotify Connect discovery uses mDNS, and the integration reaches the
# WebSocket API on 127.0.0.1, so the add-on shares the host network.
host_network: true
audio: true
options:
  device_name: Home Assistant
  websocket_port: 9090
  update_check_interval_hours: 12
  update_hour: 4
  reset_pairing: false
  verbose: false
schema:
  device_name: str
  api_key: password
  websocket_port: port
  initial_volume: int(0,100)?
  cache_size_mb: int(0,)?
  update_check_interval_hours: int(1,168)
  update_hour: int(0,23)
  reset_pairing: bool
  verbose: bool
