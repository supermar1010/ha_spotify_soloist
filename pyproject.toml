[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["custom_components"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
# Line length is left to the formatter; a timeout argument on probe() is
# clearer than making every caller wrap it.
ignore = ["E501", "ASYNC109"]

[tool.ruff.lint.isort]
# Same import style as Home Assistant core.
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110"]
