name: Publish add-on

# Builds the add-on images and pushes them to GHCR, so Home Assistant can
# pull them instead of building on the device. The images do not contain
# Soloist; it is downloaded at runtime.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read add-on metadata
        id: meta
        run: |
          echo "version=$(yq '.version' spotify_soloist/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "base=$(yq '.build_from.${{ matrix.arch }}' spotify_soloist/build.yaml)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.arch }}-addon-spotify_soloist" >> "$GITHUB_OUTPUT"
      - name: Check release tag matches config.yaml
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [[ "${tag}" != "${{ steps.meta.outputs.version }}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match config.yaml version ${{ steps.meta.outputs.version }}" >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: spotify_soloist
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=${{ steps.meta.outputs.base }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            io.hass.name=Spotify Soloist
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.arch }}
